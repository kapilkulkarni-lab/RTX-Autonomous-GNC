# mission_manager parameters (outline: Config and thresholds). This file is the single source of
# the numbers: the node reads it (installed copy) as its parameter defaults, and
# `--ros-args -p name:=value` or `--params-file` still override it.
# Placeholders are starting guesses for sim only, not agreed numbers. Only the parameters the
# current milestone uses are listed; later milestones add theirs.
mission_manager:
  ros__parameters:
    # Rates
    loop_hz: 20.0                 # state machine loop
    setpoint_hz: 20.0             # offboard heartbeat + setpoint stream to PX4
    state_pub_hz: 5.0             # /mission/state (also published on every change)

    # PREFLIGHT
    ekf_stable_s: 2.0             # TBD: position valid this long before arming
    arm_timeout_s: 10.0           # TBD: arming + offboard must succeed within this
    offboard_warmup_s: 1.0        # setpoints streamed this long before requesting offboard
    cmd_retry_s: 1.0              # resend arm / offboard / land commands this often
    require_pilot_arm: false      # true: never send arm; wait for the pilot to arm (false in SITL)

    # TAKEOFF
    search_altitude_m: 2.5        # TBD: above the start position (TAKEOFF, SEARCHING, APPROACHING transit)
    altitude_tol_m: 0.15          # TBD

    # LANDING
    landed_disarm_grace_s: 0.5    # disarm seen before PX4's landed flag: wait this long for it

    # Global checks
    pose_invalid_s: 1.0           # TBD: position invalid or stale this long -> ABORTED
    perception_stale_s: 1.0       # TBD: Perception heartbeat older than this while airborne -> ABORTED
    require_perception: true      # false: skip the Perception heartbeat check (lab flights without Perception)
    px4_status_stale_s: 1.0       # TBD: no vehicle_status this long while airborne -> ABORTED
    battery_return_pct: 30.0      # TBD: below this -> return
    force_return_at_s: 360.0      # TBD: mission clock past this -> return (limit is 420 s)

    # ABORTED
    land_after_hold_s: 3.0        # TBD: hover this long, then land in place

    # Startup
    px4_discovery_timeout_s: 20.0 # give up if no PX4 topics appear

    # Field frame: a world manifest (.json, sim) or a field config (.yaml, hardware:
    # config/field.yaml). '' = the sim world manifest ($AVC_SIM_DIR/worlds/avc_field_manifest.json).
    field_file: ''

    # Cameras: config/cameras.yaml (both cameras; also read by camera_fov). '' = installed copy.
    cameras_file: ''

    # SEARCHING
    search_pattern: lawnmower     # lawnmower | frontier | zone_sweep (comparison in SITL)
    search_rows_along: x          # lawnmower rows run along field x or y
    search_overlap: 0.2           # row overlap, as a fraction of the down camera's footprint width
    coverage_cell_m: 0.5          # coverage memory cell size
    wall_margin_m: 1.0            # TBD: fly no closer than this to the field edge
    obstacle_clearance_m: 0.5     # TBD: keep this far from obstacle edges
    cruise_speed_mps: 1.0         # TBD: peak speed per leg
    max_accel_mps2: 0.5           # TBD
    acceptance_radius_m: 0.25     # waypoint reached within this

    # APPROACHING
    hover_height_m: 1.0           # TBD: height above the start position over the die
    target_lost_s: 2.0            # TBD: no target_relative this long after arriving -> lost
    color_confirm_timeout_s: 5.0  # TBD: no confirmed color this long after arriving -> lost
    approach_center_tol_m: 0.10   # TBD: centered over the die within this
    die_match_radius_m: 0.3       # TBD: dice-map entries this close are the same die
    max_die_attempts: 2           # TBD: a die lost / never confirmed this many times is skipped

    # DESCENDING (the camera blind height is the down camera's blind_height_m in cameras.yaml)
    descent_stages_m: [1.0, 0.5, 0.25]     # TBD: stage heights, highest first
    stage_lateral_tol_m: [0.10, 0.05, 0.03]  # TBD: sideways tolerance to leave each stage
    reader_lateral_tol_m: 0.02    # TBD: the last stage's tolerance before going blind
    descent_rate_mps: 0.15        # TBD
    stage_settle_s: 3.0           # TBD: time to get within a stage's tolerance before a retry
    touchdown_range_m: 0.05       # TBD: rangefinder at or under this = touching down
    touchdown_hold_s: 0.5         # TBD: ... for this long
    descent_max_retries: 2        # TBD: then `failed` -> APPROACHING
    # Rangefinder: distance_sensor (px4_msgs/DistanceSensor on rangefinder_topic; the SITL stand-in
    # from camera_fov) or dist_bottom (vehicle_local_position.dist_bottom when dist_bottom_valid;
    # hardware, no PX4 firmware change).
    rangefinder_source: distance_sensor
    rangefinder_topic: /fmu/out/distance_sensor

    # On the die (TEMPORARY, Milestone 6 only; replaced by NFC_READY / READING in Milestone 7)
    on_die_test_s: 5.0            # stay on the die this long, then LIFTOFF -> RETURNING
    descent_test_count: 1         # landing-accuracy runs: touch down this many times first
